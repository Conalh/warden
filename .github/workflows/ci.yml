name: ci
on:
  push:
    branches: [main]
  pull_request:

# Pin minimum privileges for the GITHUB_TOKEN. This job only reads the
# checked-out code; nothing here writes to the repo or publishes artifacts.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Don't leave the GITHUB_TOKEN in .git/config — subsequent steps
          # run `cargo build`, and a poisoned transitive dep's build.rs could
          # otherwise read it off disk. (warden itself is zero-dependency, but
          # the habit costs nothing.)
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all --locked
      - name: Build (release)
        run: cargo build --release --locked
      - name: Verify package surface
        run: cargo package --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.85.0
      - name: Check minimum supported Rust version
        run: cargo check --all-targets --locked

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Format wasm crate
        run: cargo fmt --manifest-path warden-wasm/Cargo.toml -- --check
      - name: Lint wasm crate
        run: cargo clippy --manifest-path warden-wasm/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Test WebAssembly boundary in Node
        run: wasm-pack test --node warden-wasm
      - name: Build production playground bundle
        run: wasm-pack build warden-wasm --release --target web --out-dir ../playground/pkg
