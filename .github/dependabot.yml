version: 2
updates:
  - package-ecosystem: cargo
    directory: /warden-wasm
    schedule:
      interval: monthly
    groups:
      wasm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
